<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <h1 class="title is-1">Personal Watch List</h1>
    <form id="form">
      <div class="field has-addons">
        <div class="control">
          <input
            class="input"
            id="movieSearchBar"
            placeholder="Title"
            type="text"
            name="query"
          />
        </div>
        <div class="control">
          <button class="button is-info" id="movieSeachButton">Search</button>
        </div>
      </div>
    </form>

    <div id="movieContainer" class="grid"></div>

    <!-- Links -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
